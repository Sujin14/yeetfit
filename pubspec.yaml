name: yeetfit
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  # google_fonts 9+, go_router 18+, cached_network_image 4+ and shimmer 4+ are
  # built on the standalone `material_ui` package, whose types (TextTheme,
  # MaterialApp, Theme) are incompatible with `package:flutter/material.dart`.
  # Keep them on the last major that targets flutter/material until the app
  # itself migrates to material_ui.
  google_fonts: ^9.0.0
  lottie: ^3.6.1
  fl_chart: ^1.2.0
  youtube_player_iframe: ^6.0.2
  rxdart: ^0.28.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  hooks_riverpod: ^3.4.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  google_sign_in: ^7.2.0
  go_router: ^18.1.0
  intl: ^0.20.3
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  workmanager: ^0.10.10
  firebase_storage: ^14.0.0
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  health: ^13.3.2
  showcaseview: ^5.1.0
  metered_realtime: ^0.2.0
  flutter_webrtc: ^1.6.2+hotfix.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.17.1
  rename: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/yeetfit_logo.webp"
  adaptive_icon_background: "#0D0D2B"
  adaptive_icon_foreground: "assets/images/yeetfit_logo.webp"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 26
  web:
    generate: false

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # google_fonts loads these instead of downloading. It matches them by file
  # name (`Inter-<Weight>.ttf`), so keep the names unchanged.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
